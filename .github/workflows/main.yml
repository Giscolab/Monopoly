name: Update Progress Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:  # Manual trigger

jobs:
  calculate-progress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Calculate project progress
        run: >-
          python3 .github/scripts/update_porting_progress.py
          modern/PORTING_STATUS.md
          modern/porting-progress.svg
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit progress bar when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- modern/porting-progress.svg; then
            echo "Progress bar is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern/porting-progress.svg
          git commit -m "Update porting progress bar"
          git push origin "HEAD:${GITHUB_REF_NAME}"
