name: Porting Audit and Validation

on:
  push:
    branches:
      - master
    paths:
      - 'Source/**'
      - 'modern/**'
      - '!modern/porting-progress.svg'
      - '!modern/PORTING_AUDIT.md'
      - '.github/scripts/**'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  PORT_ROOT: modern
  PORT_STATUS: modern/PORTING_STATUS.md
  PORT_AUDIT: modern/PORTING_AUDIT.md
  PORT_PROGRESS: modern/porting-progress.svg
  PORT_BUILD: modern/build-ci

concurrency:
  group: porting-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Structural audit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Protect legacy and generated files
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            exit 0
          fi
          changed="$(git diff --name-only "$before" "$after")"
          forbidden="$(printf '%s\n' "$changed" | grep -E '^(Source/|modern/(porting-progress\.svg|PORTING_AUDIT\.md)$)' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden manual changes detected:"
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Validate CI layout
        shell: bash
        run: |
          set -euo pipefail
          for path in "$PORT_ROOT/CMakeLists.txt" "$PORT_STATUS" "$PORT_ROOT/PORTING_MATRIX.md" ".github/scripts/porting_audit.py" ".github/scripts/update_porting_progress.py"; do
            if [[ ! -e "$path" ]]; then
              echo "::error file=.github/workflows/main.yml::Required porting path is missing: $path"
              exit 1
            fi
          done

      - name: Test porting audit tools
        run: python .github/scripts/test_porting_tools.py

      - name: Generate structural audit
        run: >-
          python .github/scripts/porting_audit.py
          "$PORT_STATUS"
          "$PORT_ROOT"
          --strict
          --report "$PORT_AUDIT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Generate inventory dashboard
        run: >-
          python .github/scripts/update_porting_progress.py
          "$PORT_STATUS"
          "$PORT_PROGRESS"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Check generated diff
        run: git diff --check

      - name: Commit generated audit artifacts when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$PORT_AUDIT" "$PORT_PROGRESS"; then
            echo "Generated audit artifacts are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PORT_AUDIT" "$PORT_PROGRESS"
          git commit -m "Update automated porting audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  windows-validation:
    name: Windows build and CTest
    needs: audit
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install and verify video test tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) {
            throw "FFmpeg installation failed with exit code $LASTEXITCODE"
          }
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $executable = (Get-Command $tool -CommandType Application -ErrorAction Stop).Source
            & $executable -version
            if ($LASTEXITCODE -ne 0) {
              throw "$tool verification failed with exit code $LASTEXITCODE"
            }
            "MONOPOLY_TEST_$($tool.ToUpperInvariant())=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Configure Debug build
        shell: pwsh
        run: cmake -S "$env:PORT_ROOT" -B "$env:PORT_BUILD" -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build "$env:PORT_BUILD" --config Debug --parallel 2

      - name: Run complete CTest suite
        shell: pwsh
        run: ctest --test-dir "$env:PORT_BUILD" -C Debug --output-on-failure

      - name: Publish validation summary
        if: success()
        shell: pwsh
        run: |
          "## Windows validation" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- CMake configure: PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Debug build: PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Complete CTest suite: PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload CTest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-failure-log
          path: ${{ env.PORT_BUILD }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
