name: Update Progress Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:  # Manual trigger

jobs:
  calculate-progress:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Calculate project progress
        shell: bash
        run: |
          set -euo pipefail
          STATUS_FILE="modern/PORTING_STATUS.md"

          if [[ ! -f "$STATUS_FILE" ]]; then
            echo "Missing $STATUS_FILE" >&2
            exit 1
          fi

          count_status() {
            grep -cF "| \`$1\` |" "$STATUS_FILE" || true
          }
          COMPLETE=$(count_status PORTED_COMPLETE)
          REPLACED=$(count_status REPLACED_PORTABLE)
          PARTIAL=$(count_status PORTED_PARTIAL)
          NOT_STARTED=$(count_status NOT_STARTED)
          BLOCKED=$(count_status BLOCKED_MISSING_DATA)
          TOOLING=$(count_status MISSING_TOOLING)
          UNUSED=$(count_status LEGACY_UNUSED)

          ACTIVE=$((COMPLETE + REPLACED + PARTIAL + NOT_STARTED))
          FULLY_DONE=$((COMPLETE + REPLACED))
          if (( ACTIVE > 0 )); then
            INDEX=$(((FULLY_DONE * 100 + PARTIAL * 50) / ACTIVE))
          else
            INDEX=0
          fi

          {
            echo "## 📊 Progress Stats"
            echo "- **Porting index**: ${INDEX}%"
            echo "- **Complete / portable replacements**: ${FULLY_DONE} / ${ACTIVE}"
            echo "- **Partial**: ${PARTIAL}"
            echo "- **Not started**: ${NOT_STARTED}"
            echo "- **Blocked / missing data**: ${BLOCKED}"
            echo "- **Missing tooling**: ${TOOLING}"
            echo "- **Legacy unused**: ${UNUSED}"
            echo "- **Last updated**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "> Index formula: complete/replaced = 100%, partial = 50%, not started = 0%. Blocked/tooling/unused entries are excluded from the denominator."
          } | tee -a "$GITHUB_STEP_SUMMARY"
