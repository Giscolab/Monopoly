name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'modern/src/**'
      - 'modern/*.md'
      - 'modern/porting-progress.svg'
      - 'docs/**'
      - '.github/scripts/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Doxygen site
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Fetch Doxygen Awesome 2.4.2
        run: |
          git clone --depth 1 --branch v2.4.2 \
            https://github.com/jothepro/doxygen-awesome-css.git \
            doxygen-awesome-css

      - name: Refresh generated documentation inputs
        run: |
          python .github/scripts/porting_audit.py \
            modern/PORTING_STATUS.md modern --strict \
            --report modern/PORTING_AUDIT.md
          python .github/scripts/update_porting_progress.py \
            modern/PORTING_STATUS.md modern/porting-progress.svg

      - name: Generate documentation
        run: doxygen docs/Doxyfile

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail
          for page in index porting_status porting_matrix porting_audit resource_setup presentation procedural_play blender_integration visual_polish visual_ui_polish; do
            test -s "modern/build-docs/html/$page.html"
          done
          test -s modern/build-docs/html/porting-progress.svg

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: modern/build-docs/html

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
