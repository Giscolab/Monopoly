<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" viewBox="0 0 760 386" role="img" aria-label="Inventaire du portage ; aucune estimation automatique de fidélité">
  <title>Monopoly modern — inventaire et validation de référence</title>
  <rect width="760" height="386" rx="12" fill="#f6f8fa"/>
  <text x="18" y="27" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#24292f">Monopoly modern — état du portage</text>
  <text x="18" y="65" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f">Fonctionnalités du jeu</text>
  <text x="742" y="65" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24292f">Non établi</text>
  <text x="18" y="83" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#24292f">Aucun pourcentage déduit du nombre de fichiers ou de lignes.</text>
  <text x="18" y="114" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f">Complètes ou remplacées</text>
  <text x="742" y="114" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24292f">37</text>
  <text x="18" y="132" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#24292f">Entrées de la matrice, périmètre documenté.</text>
  <text x="18" y="163" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f">Écarts actifs connus</text>
  <text x="742" y="163" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24292f">2</text>
  <text x="18" y="181" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#24292f">2 partielles ; 0 non commencées.</text>
  <text x="18" y="212" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f">Comparaisons à mener</text>
  <text x="742" y="212" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24292f">28</text>
  <text x="18" y="230" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#24292f">REVIEW_REQUIRED : aucun manque de code déduit sans comparaison.</text>
  <text x="18" y="261" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f">Données ou outils manquants</text>
  <text x="742" y="261" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24292f">5</text>
  <text x="18" y="279" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#24292f">Blocages de qualification ou de production documentés.</text>
  <text x="18" y="310" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f">CTest de référence</text>
  <text x="742" y="310" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24292f">132/132</text>
  <text x="18" y="328" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#24292f">code `d77be96`, Windows/MSVC Debug, 26 septembre 2026.</text>
  <line x1="18" y1="355" x2="742" y2="355" stroke="#d8dee4"/>
  <text x="18" y="375" font-family="Arial, sans-serif" font-size="11" fill="#57606a">Les entrées partagent des dépendances : leur nombre ne mesure pas la fidélité du jeu.</text>
</svg>
